<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>University Exhibition Interactive Map</title>


    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            min-height: 100dvh;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
            overscroll-behavior: none;
        }


        /* =========================
           MAP
        ========================= */

        .map-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            background: #000;
            cursor: grab;
            touch-action: none;
        }

        .map-container.is-dragging {
            cursor: grabbing;
        }

        /* Image + numbers move together when zooming/panning */
        .map-stage {
            position: relative;
            width: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        .map-image {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }


        /* =========================
           NUMBER CIRCLE
        ========================= */

        .map-number {

            position: absolute;

            width: clamp(32px, 5vw, 48px);
            height: clamp(32px, 5vw, 48px);

            border-radius: 50%;

            background: red;
            color: white;

            border: 3px solid white;

            font-size: clamp(14px, 2.2vw, 21px);

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transform: translate(-50%, -50%);

            box-shadow:
                0 2px 8px rgba(0,0,0,0.5);

            z-index: 10;

            user-select: none;
        }


        .map-number:hover {

            transform:
                translate(-50%, -50%)
                scale(1.15);
        }


        /* =========================
           NUMBER POSITIONS
        ========================= */

        .number1 {
            right: 22%;
            bottom: 55%;
        }

        .number3 {
            right: 62.45%;
            bottom: 71%;
        }

        .number2 {
            right: 19%;
            bottom: 28%;
        }

        .number4 {
            right: 53.30%;
            bottom: 26%;
        }

        .number5 {
            left: 100%;
            top: 100%;
        }

        .number6 {
            right: 48%;
            bottom: 45.20%;
        }

        .number7 {
            right: 27.12%;
            bottom: 14%;
        }



        /* =========================
           POPUP BACKGROUND
        ========================= */

        .info-box {

            display: none;

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,0.80);

            z-index: 1000;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* =========================
           POPUP CONTENT
        ========================= */

        .popup-content {

            position: relative;

            background: #111;

            width: min(95vw, 1100px);

            max-height: 90vh;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 0 30px rgba(0,0,0,0.7);

            overflow: hidden;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {

            position: absolute;

            top: 10px;
            right: 10px;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 2px solid white;

            background: black;

            color: white;

            font-size: 25px;

            font-weight: bold;

            cursor: pointer;

            z-index: 1100;
        }


        .close-button:hover {

            background: red;
        }


        /* =========================
           GALLERY
        ========================= */

        .gallery {

            padding: 30px 0;

            overflow: hidden;
        }


        .gallery h2 {

            text-align: center;

            font-size: clamp(22px, 5vw, 35px);

            margin-bottom: clamp(12px, 3vw, 25px);
        }


        /* =========================
           HORIZONTAL SLIDER
        ========================= */

        .slider {

            display: flex;

            gap: 25px;

            overflow-x: auto;

            padding: 20px 8%;

            scroll-behavior: smooth;

            scrollbar-width: none;

            cursor: grab;

            touch-action: pan-x;
        }


        .slider::-webkit-scrollbar {

            display: none;
        }


        .slider:active {

            cursor: grabbing;
        }


        /* =========================
           IMAGE CARD
        ========================= */

        .card {

            flex: 0 0 clamp(240px, 72vw, 330px);

            height: clamp(300px, 55vh, 430px);

            border-radius: 25px;

            overflow: hidden;

            background: #222;

            transition: 0.4s ease;
        }


        .card img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           HOVER EFFECT
        ========================= */

        .card:hover {

            transform: scale(1.05);
        }


        /* =========================
           SIDE IMAGE EFFECT
        ========================= */

        .card:first-child,
        .card:last-child {

            opacity: 0.6;

            transform: scale(0.9);
        }


        .card:first-child:hover,
        .card:last-child:hover {

            opacity: 1;

            transform: scale(0.95);
        }


        /* =========================
           MANUAL ZOOM CONTROLS
        ========================= */

        .zoom-controls {
            position: fixed;
            right: max(10px, env(safe-area-inset-right, 10px));
            bottom: max(10px, env(safe-area-inset-bottom, 10px));
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 2vw, 10px);
        }

        .zoom-controls button {
            width: clamp(44px, 12vw, 52px);
            height: clamp(44px, 12vw, 52px);
            border: 2px solid white;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: clamp(20px, 5vw, 26px);
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .zoom-controls button:hover {
            background: red;
        }

        .zoom-hint {
            position: fixed;
            left: 50%;
            bottom: max(10px, env(safe-area-inset-bottom, 10px));
            transform: translateX(-50%);
            z-index: 400;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.65);
            color: #ddd;
            font-size: clamp(10px, 2.5vw, 13px);
            pointer-events: none;
            white-space: nowrap;
            max-width: calc(100vw - 100px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            .popup-content {
                width: 96vw;
                padding: 14px;
                border-radius: 14px;
            }

            .close-button {
                width: 36px;
                height: 36px;
                font-size: 22px;
            }

            .slider {
                gap: 16px;
                padding: 16px 6%;
            }
        }


    </style>

</head>


<body>


<!-- ==================================================
     MAP
================================================== -->

<div class="map-container">

    <div class="map-stage" id="mapStage">

    <!-- MAP IMAGE -->

    <img src="MAP3.jpg.jpeg"
         class="map-image"
         id="mapImage"
         alt="University Map">


    <!-- =====================
         NUMBER 1
    ====================== -->

    <div class="map-number number1"
         onclick="showImage(1)">

        4

    </div>


    <!-- =====================
         NUMBER 2
    ====================== -->

    <div class="map-number number2"
         onclick="showImage(2)">

        2

    </div>


    <!-- =====================
         NUMBER 3
    ====================== -->

    <div class="map-number number3"
         onclick="showImage(3)">

        3

    </div>


    <!-- =====================
         NUMBER 4
    ====================== -->

    <div class="map-number number4"
         onclick="showImage(4)">

        1

    </div>


    <!-- =====================
         NUMBER 5
    ====================== -->

    <div >

    </div>


    <!-- =====================
         NUMBER 6
    ====================== -->

    <div class="map-number number6"
         onclick="showImage(6)" style="background-color: rgb(255, 240, 34); color: black;">

        B

    </div>


    <!-- =====================

    ====================== -->

    <div class="map-number number7"
         onclick="showImage(7)" style="background-color: rgb(255, 240, 34); color: #111;">

        A

    </div>



    </div>


</div>


<!-- ==================================================
     MANUAL ZOOM CONTROLS
================================================== -->

<div class="zoom-controls">

    <button type="button" onclick="zoomIn()" aria-label="Zoom in">+</button>

    <button type="button" onclick="zoomOut()" aria-label="Zoom out">−</button>

    <button type="button" onclick="resetZoom()" aria-label="Reset zoom">↺</button>

</div>

<p class="zoom-hint">Pinch / scroll කර zoom · drag කර map එක move කරන්න</p>



<!-- ==================================================
     POPUP
================================================== -->

<div id="pop-up"
     class="info-box">


    <div class="popup-content">


        <!-- CLOSE BUTTON -->

        <button class="close-button"
                onclick="closeBox()">

            ×

        </button>



        <!-- =====================
             PROJECT GALLERY
        ====================== -->

        <section class="gallery">


            <h2 id="popup-title">
                Project
            </h2>


            <div class="slider"
                 id="popup-gallery">

                <!-- Images are added by JavaScript -->

            </div>


        </section>


    </div>


</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


/* =========================================
   ZOOM + PAN (all devices)
========================================= */

const mapContainer = document.querySelector(".map-container");
const mapStage = document.getElementById("mapStage");
const mapImage = document.getElementById("mapImage");

const MAX_ZOOM = 5;
const ZOOM_STEP = 0.25;

let baseZoom = 1;
let currentZoom = 1;
let currentX = 0;
let currentY = 0;

let isDragging = false;
let dragReady = false;
let dragStartX = 0;
let dragStartY = 0;
let dragOriginX = 0;
let dragOriginY = 0;

const DRAG_THRESHOLD = 6;

let lastPinchDistance = 0;
let activePointers = new Map();

function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
}

function getContainerSize() {
    return {
        width: mapContainer.clientWidth,
        height: mapContainer.clientHeight
    };
}

function getStageSize() {
    return {
        width: mapStage.offsetWidth * currentZoom,
        height: mapStage.offsetHeight * currentZoom
    };
}

function computeBaseZoom() {
    const container = getContainerSize();
    const stageW = mapStage.offsetWidth;
    const stageH = mapStage.offsetHeight;

    if (!stageW || !stageH) {
        return 1;
    }

    const scaleX = container.width / stageW;
    const scaleY = container.height / stageH;

    return Math.max(scaleX, scaleY);
}

function clampPan() {
    const container = getContainerSize();
    const stageSize = getStageSize();

    if (stageSize.width <= container.width) {
        currentX = (container.width - stageSize.width) / 2;
    } else {
        currentX = clamp(currentX, container.width - stageSize.width, 0);
    }

    if (stageSize.height <= container.height) {
        currentY = (container.height - stageSize.height) / 2;
    } else {
        currentY = clamp(currentY, container.height - stageSize.height, 0);
    }
}

function applyTransform() {
    clampPan();
    mapStage.style.transform =
        `translate(${currentX}px, ${currentY}px) scale(${currentZoom})`;
}

function fitToScreen() {
    baseZoom = computeBaseZoom();
    currentZoom = baseZoom;

    const container = getContainerSize();
    const stageSize = getStageSize();

    currentX = (container.width - stageSize.width) / 2;
    currentY = (container.height - stageSize.height) / 2;

    applyTransform();
}

function setZoom(nextZoom, focusX, focusY) {
    const container = getContainerSize();
    const pointX = focusX ?? container.width / 2;
    const pointY = focusY ?? container.height / 2;

    const prevZoom = currentZoom;
    currentZoom = clamp(nextZoom, baseZoom, MAX_ZOOM);

    const zoomRatio = currentZoom / prevZoom;
    currentX = pointX - (pointX - currentX) * zoomRatio;
    currentY = pointY - (pointY - currentY) * zoomRatio;

    applyTransform();
}

function zoomIn() {
    const container = getContainerSize();
    setZoom(currentZoom + ZOOM_STEP, container.width / 2, container.height / 2);
}

function zoomOut() {
    const container = getContainerSize();
    setZoom(currentZoom - ZOOM_STEP, container.width / 2, container.height / 2);
}

function resetZoom() {
    fitToScreen();
}

function canPan() {
    const container = getContainerSize();
    const stageSize = getStageSize();

    return (
        stageSize.width > container.width + 0.5 ||
        stageSize.height > container.height + 0.5
    );
}

function getPointerDistance(p1, p2) {
    const dx = p1.clientX - p2.clientX;
    const dy = p1.clientY - p2.clientY;
    return Math.hypot(dx, dy);
}

function startDrag(clientX, clientY, target) {
    if (target.closest(".map-number") || !canPan()) {
        return;
    }

    dragReady = true;
    dragStartX = clientX;
    dragStartY = clientY;
    dragOriginX = currentX;
    dragOriginY = currentY;
}

function moveDrag(clientX, clientY) {
    if (!dragReady && !isDragging) {
        return;
    }

    const movedX = clientX - dragStartX;
    const movedY = clientY - dragStartY;

    if (!isDragging) {
        if (Math.hypot(movedX, movedY) < DRAG_THRESHOLD) {
            return;
        }

        isDragging = true;
        mapContainer.classList.add("is-dragging");
    }

    currentX = dragOriginX + movedX;
    currentY = dragOriginY + movedY;
    applyTransform();
}

function endDrag() {
    dragReady = false;
    isDragging = false;
    mapContainer.classList.remove("is-dragging");
}

mapContainer.addEventListener("mousedown", function(event) {
    if (event.button !== 0) {
        return;
    }

    startDrag(event.clientX, event.clientY, event.target);
});

window.addEventListener("mousemove", function(event) {
    moveDrag(event.clientX, event.clientY);
});

window.addEventListener("mouseup", endDrag);

mapContainer.addEventListener("wheel", function(event) {
    event.preventDefault();

    const rect = mapContainer.getBoundingClientRect();
    const focusX = event.clientX - rect.left;
    const focusY = event.clientY - rect.top;
    const delta = event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;

    setZoom(currentZoom + delta, focusX, focusY);
}, { passive: false });

mapContainer.addEventListener("pointerdown", function(event) {
    if (event.target.closest(".map-number")) {
        return;
    }

    activePointers.set(event.pointerId, event);

    if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        lastPinchDistance = getPointerDistance(points[0], points[1]);
    } else if (activePointers.size === 1 && event.pointerType === "touch") {
        startDrag(event.clientX, event.clientY, event.target);
    }
});

mapContainer.addEventListener("pointermove", function(event) {
    if (!activePointers.has(event.pointerId)) {
        return;
    }

    activePointers.set(event.pointerId, event);

    if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        const distance = getPointerDistance(points[0], points[1]);

        if (lastPinchDistance > 0) {
            const rect = mapContainer.getBoundingClientRect();
            const centerX =
                (points[0].clientX + points[1].clientX) / 2 - rect.left;
            const centerY =
                (points[0].clientY + points[1].clientY) / 2 - rect.top;
            const scaleChange = distance / lastPinchDistance;

            setZoom(currentZoom * scaleChange, centerX, centerY);
        }

        lastPinchDistance = distance;
        return;
    }

    if (activePointers.size === 1 && event.pointerType === "touch") {
        moveDrag(event.clientX, event.clientY);
    }
});

function clearPointer(event) {
    activePointers.delete(event.pointerId);

    if (activePointers.size < 2) {
        lastPinchDistance = 0;
    }

    if (activePointers.size === 0) {
        endDrag();
    }
}

mapContainer.addEventListener("pointerup", clearPointer);
mapContainer.addEventListener("pointercancel", clearPointer);
mapContainer.addEventListener("pointerleave", clearPointer);

window.addEventListener("resize", function() {
    const previousBase = baseZoom;
    baseZoom = computeBaseZoom();

    if (currentZoom < baseZoom) {
        currentZoom = baseZoom;
    }

    if (Math.abs(baseZoom - previousBase) > 0.01) {
        fitToScreen();
    } else {
        applyTransform();
    }
});

function initMapView() {
    fitToScreen();
}

if (mapImage.complete) {
    initMapView();
} else {
    mapImage.addEventListener("load", initMapView);
}

window.addEventListener("orientationchange", function() {
    setTimeout(initMapView, 150);
});


/* =========================================
   PROJECT IMAGE DATA
========================================= */


const projects = {


    1: [

     "images/project4/Gel Blaster Arena Event.png",

    

    ],


    2: [

        "images/project2/Exhibition.png",
        "images/project2/VR Zone.png",
        "images/project2/Game Zone.png",
        "images/project2/Robotic Competition.png",
        "images/project2/Industrial Drone.png",

    ],


    3: [

        "images/project3/Drone Show.png",

  

    ],


    4: [

        "images/project1/food stall.png",

  
    ],


    5: [

        "images/project5/image1.jpg",

        "images/project5/image2.jpg",

        "images/project5/image3.jpg"

    ],


    6: [

        

        "images/project6/Drone stall.png"

  

    ],


    7: [
        
        "images/projectA/Magic Show.png",
   

    ],


    8: [

        "images/project8/image1.jpg",

        "images/project8/image2.jpg",

        "images/project8/image3.jpg"

    ],


    9: [

        "images/project9/image1.jpg",

        "images/project9/image2.jpg",

        "images/project9/image3.jpg"

    ],


    10: [

        "images/project10/image1.jpg",

        "images/project10/image2.jpg",

        "images/project10/image3.jpg"

    ]

};



/* =========================================
   OPEN POPUP
========================================= */


function showImage(number) {


    const gallery =
        document.getElementById(
            "popup-gallery"
        );


    const title =
        document.getElementById(
            "popup-title"
        );


    /* Clear old images */

    gallery.innerHTML = "";


    /* Change project title */
    const projectNames = {
        1: "Old Playground",
        2: "Department",
        3: "New PlayGround",
        4: "Food Stall",
        5: "ggggggg",
        6: "Canteen",
        7: "Auditorium",
       
    };

    title.innerText = projectNames[number] || "Project " + number;

    /* Get selected project */

    const selectedProject =
        projects[number];



    /* Create cards */

    selectedProject.forEach(
        function(imagePath) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";



            const image =
                document.createElement(
                    "img"
                );


            image.src =
                imagePath;


            image.alt =
                "Project " + number;



            card.appendChild(
                image
            );


            gallery.appendChild(
                card
            );

        }
    );



    /* Show popup */

    document.getElementById(
        "pop-up"
    ).style.display = "flex";

}



/* =========================================
   CLOSE POPUP
========================================= */


function closeBox() {


    document.getElementById(
        "pop-up"
    ).style.display = "none";

}



/* =========================================
   CLICK OUTSIDE POPUP TO CLOSE
========================================= */


document.getElementById(
    "pop-up"
).addEventListener(
    "click",
    function(event) {


        if (
            event.target === this
        ) {

            closeBox();

        }

    }
);


</script>


</body>
